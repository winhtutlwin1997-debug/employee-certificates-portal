<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Certificate Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <p class="eyebrow">Certificate Verification</p>
        <h1>Employee Portal</h1>
        <p class="muted">Scan a QR code to open an employee profile and verify certificates.</p>
      </div>

      <label class="search-wrap" for="employee-search">
        <span>Search employee</span>
        <input id="employee-search" type="search" placeholder="Type name or ID">
      </label>

      <div id="employee-list" class="employee-list"></div>
    </aside>

    <main class="content">
      <section id="employee-profile" class="profile-card"></section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
